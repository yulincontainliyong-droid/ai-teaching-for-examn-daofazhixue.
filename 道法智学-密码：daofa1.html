            checkStreak() {
                const today = new Date().toDateString();
                if (this.userStats.lastStudyDate !== today) {
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);

                    if (this.userStats.lastStudyDate === yesterday.toDateString()) {
                        this.userStats.streak++;
                    } else {
                        this.userStats.streak = 1; // Reset or Start
                    }
                    // Save immediately to persist the streak update
                    this.saveStats();
                }
            }

            saveStats() {
                this.userStats.lastStudyDate = new Date().toDateString();
                localStorage.setItem('daofa_stats', JSON.stringify(this.userStats));
                this.updateDashboardStats();
            }

            updateDashboardStats() {
                document.getElementById('stat-total-answered').textContent = this.userStats.totalAnswered;
                const rate = this.userStats.totalAnswered === 0 ? 0 : Math.round((this.userStats.correctCount / this.userStats.totalAnswered) * 100);
                document.getElementById('stat-accuracy').textContent = rate + '%';
                document.getElementById('stat-streak').textContent = this.userStats.streak;
            }

            setupSearch() {
                const input = document.getElementById('search-input');
                let debounceTimer;

                input.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase().trim();

                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        this.performSearch(term);
                    }, 300);
                });
            }

            performSearch(term) {
                const gridArea = document.getElementById('unit-grid-area');
                const searchArea = document.getElementById('search-results-area');
                const searchList = document.getElementById('search-list');
                const btnPractice = document.getElementById('btn-practice-search');

                if (!term) {
                    gridArea.style.display = 'block';
                    searchArea.style.display = 'none';
                    searchArea.classList.add('hidden');
                    return;
                }

                gridArea.style.display = 'none';
                searchArea.style.display = 'block';
                searchArea.classList.remove('hidden');
                searchList.innerHTML = '';

                // Find all matching questions
                const matches = [];
                this.data.forEach(unit => {
                    unit.questions.forEach(q => {
                        // Filter: only search practice questions (not points)
                        if (q.type === 'point') return;

                        const content = (q.question + (q.explanation || '')).toLowerCase();
                        if (content.includes(term)) {
                            matches.push({ ...q, unitTitle: unit.title });
                        }
                    });
                });

                this.state.searchResults = matches;
                document.getElementById('search-count').textContent = `(找到 ${matches.length} 题)`;

                if (matches.length === 0) {
                    searchList.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:40px; font-size:1.2rem;">未找到相关题目，换个关键词试试？</div>';
                    btnPractice.disabled = true;
                    btnPractice.style.opacity = 0.5;
                } else {
                    btnPractice.disabled = false;
                    btnPractice.style.opacity = 1;

                    matches.slice(0, 50).forEach((q, index) => {
                        const el = document.createElement('div');
                        el.className = 'result-item';
                        el.style.animationDelay = `${index * 0.03}s`;

                        // Highlight logic (simple)
                        const snippet = q.question.substring(0, 150) + '...';
                        const highlighted = snippet.replace(new RegExp(term, 'gi'), match => `<span class="result-match">${match}</span>`);

                        el.innerHTML = `
                        <div class="result-meta">
                            <span>${q.unitTitle}</span>
                            <span class="card-badge">${q.type === 'choice' ? '选择题' : '材料题'}</span>
                        </div>
                        <div style="line-height:1.6; font-size:1.1rem;">${highlighted}</div>
                    `;
                        el.onclick = () => this.startQuiz('single_search', q.id);
                        searchList.appendChild(el);
                    });

                    if (matches.length > 50) {
                        const more = document.createElement('div');
                        more.style.textAlign = 'center';
                        more.style.color = 'var(--text-muted)';
                        more.style.padding = '15px';
                        more.textContent = `...还有 ${matches.length - 50} 个结果`;
                        searchList.appendChild(more);
                    }
                }
            }

            clearSearch() {
                document.getElementById('search-input').value = '';
                this.performSearch('');
            }

            startQuiz(mode, param) {
                this.state.score = 0;
                this.state.currentIndex = 0;
                this.state.answers = {};

                let questions = [];
                let title = "";

                if (mode === 'all') {
                    this.data.forEach(u => questions.push(...u.questions));
                    questions = this.shuffle(questions).slice(0, 20);
                    title = '全真模拟';
                } else if (mode === 'smart') {
                    this.data.forEach(u => questions.push(...u.questions));
                    questions = this.shuffle(questions).slice(0, 15);
                    title = '智能推荐';
                } else if (mode === 'only_choice') {
                    this.data.forEach(u => questions.push(...u.questions));
                    questions = questions.filter(q => q.type === 'choice');
                    questions = this.shuffle(questions).slice(0, 30);
                    title = '专项：选择题';
                } else if (mode === 'only_material') {
                    this.data.forEach(u => questions.push(...u.questions));
                    questions = questions.filter(q => q.type === 'material' && !q.question.includes('规则') && !q.question.includes('自由'));
                    questions = this.shuffle(questions).slice(0, 30);
                    title = '专项：材料题';
                } else if (mode === 'search_results') {
                    questions = [...this.state.searchResults];
                    title = `专项练习 (${questions.length}题)`;
                } else if (mode === 'single_search') {
                    // Find specific question
                    const targetQ = this.state.searchResults.find(q => q.id === param);
                    if (targetQ) questions = [targetQ];
                    title = "单题练习";
                } else if (mode === 'wrong') {
                    // Handled by retry
                } else {
                    const unit = this.data.find(u => u.id === mode);
                    questions = [...unit.questions];
                    title = unit.title;
                }

                this.state.questions = questions;
                this.state.currentUnitId = title;
                this.updateQuizUI();
                this.switchView('view-quiz');
            }

            updateQuizUI() {
                const q = this.state.questions[this.state.currentIndex];
                const total = this.state.questions.length;
                const progress = ((this.state.currentIndex + 1) / total) * 100;

                document.getElementById('quiz-progress-text').textContent = `进度 ${this.state.currentIndex + 1}/${total}`;
                document.getElementById('progress-fill').style.width = `${progress}%`;
                document.getElementById('quiz-score-live').textContent = `得分: ${this.state.score}`;
                document.getElementById('q-tag').textContent = this.state.currentUnitId;

                // Render Question
                document.getElementById('q-text').innerHTML = q.question;

                // Reset Feedback
                const feedback = document.getElementById('q-feedback');
                feedback.style.display = 'none';
                feedback.className = 'feedback-panel';
                document.getElementById('material-section').classList.add('hidden');
                document.getElementById('btn-show-ans').classList.add('hidden');

                // Reset Material Timer
                clearInterval(this.state.materialTimer);
                this.state.materialCanReveal = false;
                this.state.materialTimeLeft = 90;

                // Render Options
                const optsContainer = document.getElementById('q-options');
                optsContainer.innerHTML = '';

                const isLast = this.state.currentIndex === total - 1;
                document.getElementById('btn-next').classList.toggle('hidden', isLast);
                document.getElementById('btn-finish').classList.toggle('hidden', !isLast);
                document.getElementById('btn-prev').disabled = this.state.currentIndex === 0;

                if (q.type === 'choice') {
                    const prevAns = this.state.answers[q.id];

                    q.options.forEach(opt => {
                        const btn = document.createElement('div');
                        btn.className = 'option-item';

                        // Extract letter
                        let letter = "A";
                        const match = opt.match(/^([A-D])\./);
                        if (match) letter = match[1];

                        btn.innerHTML = `
                        <span style="font-weight:bold; color:var(--primary); width:40px; font-size:1.2em;">${letter}</span>
                        <span>${opt.replace(/^[A-D]\./, '')}</span>
                    `;

                        if (prevAns) {
                            btn.style.pointerEvents = 'none';
                            if (letter === q.answer) btn.classList.add('correct');
                            if (letter === prevAns.selected && !prevAns.correct) btn.classList.add('wrong');
                        } else {
                            btn.onclick = () => this.handleAnswer(q, letter, btn);
                        }

                        optsContainer.appendChild(btn);
                    });

                    if (prevAns) this.showFeedback(q, prevAns.correct);

                } else if (q.type === 'point') {
                    // Point Dictation in Review Mode
                    document.getElementById('btn-show-ans').classList.remove('hidden');
                    document.getElementById('material-content').innerHTML = q.explanation;

                    // Clear and Hide Source Box
                    document.getElementById('q-feedback').style.display = 'none';

                    optsContainer.innerHTML = '<div style="color:var(--text-muted); padding:40px; text-align:center; font-size:1.3rem;">请默写/背诵该知识点，完成后点击下方“查看答案”自查。</div>';

                } else {
                    // Material Question
                    const showAnsBtn = document.getElementById('btn-show-ans');
                    showAnsBtn.classList.remove('hidden');
                    showAnsBtn.disabled = true;
                    showAnsBtn.innerHTML = `<i class="fas fa-eye"></i> 查看答案 (90s)`;

                    document.getElementById('material-content').innerHTML = q.explanation;

                    // Clear and Hide Source Box in Feedback Panel (will show when revealed)
                    document.getElementById('q-feedback').style.display = 'none';

                    optsContainer.innerHTML = '<div style="color:var(--text-muted); font-style:italic; padding:40px; text-align:center; font-size:1.3rem;">这是一道材料题，请思考后点击查看答案。</div>';

                    // Start 90-second timer
                    this.state.materialTimer = setInterval(() => {
                        this.state.materialTimeLeft--;
                        if (this.state.materialTimeLeft <= 0) {
                            clearInterval(this.state.materialTimer);
                            this.state.materialCanReveal = true;
                            showAnsBtn.disabled = false;
                            showAnsBtn.innerHTML = `<i class="fas fa-eye"></i> 查看答案`;
                        } else {
                            showAnsBtn.innerHTML = `<i class="fas fa-eye"></i> 查看答案 (${this.state.materialTimeLeft}s)`;
                        }
                    }, 1000);
                }
            }

            handleAnswer(q, selected, btn) {
                const correct = selected === q.answer;
                this.state.answers[q.id] = { selected, correct };

                // Update Stats
                this.userStats.totalAnswered++;
                if (correct) {
                    this.state.score += 5;
                    this.userStats.correctCount++;
                }
                this.saveStats();

                // Update UI
                const allBtns = document.querySelectorAll('.option-item');
                allBtns.forEach(b => {
                    b.style.pointerEvents = 'none';
                    if (b.innerText.startsWith(q.answer)) b.classList.add('correct');
                });

                if (!correct) btn.classList.add('wrong');

                this.showFeedback(q, correct);
            }

            showFeedback(q, correct) {
                const panel = document.getElementById('q-feedback');
                panel.style.display = 'block';
                panel.style.background = ''; // Clear inline styles
                panel.style.borderLeftColor = '';
                panel.className = 'feedback-panel'; // Reset classes
                panel.classList.add(correct ? 'correct' : 'wrong');

                document.getElementById('q-explanation').style.display = 'block'; // Ensure explanation is visible
                document.getElementById('q-explanation').innerHTML = q.explanation || "暂无详细解析";

                // Show Source
                const sourceBox = document.getElementById('q-source-box');
                if (q.source) {
                    sourceBox.classList.remove('hidden');
                    sourceBox.style.display = 'block';
                    // Enhance formatting
                    let sourceText = q.source.replace(/｜/g, "<br>")
                        .replace(/\+/g, ' <br><i class="fas fa-plus-circle" style="font-size:0.8em; color:var(--primary); margin:0 5px;"></i> ');
                    document.getElementById('q-source-content').innerHTML = sourceText;
                } else {
                    sourceBox.classList.add('hidden');
                    sourceBox.style.display = 'none';
                }
            }

            revealMaterial() {
                // Check if time limit has passed
                if (!this.state.materialCanReveal) {
                    return; // Do nothing if time limit not reached
                }

                document.getElementById('material-section').classList.remove('hidden');

                // Show Source Logic for Material
                const q = this.state.questions[this.state.currentIndex];

                // Reuse the feedback panel structure but customize for material
                const panel = document.getElementById('q-feedback');
                panel.style.display = 'block';
                panel.style.background = ''; // Clear inline styles
                panel.style.borderLeftColor = '';
                panel.className = 'feedback-panel material'; // Use new class

                // Hide standard explanation part since it is in material-content
                document.getElementById('q-explanation').style.display = 'none';

                // Show Source Box Only
                const sourceBox = document.getElementById('q-source-box');
                if (q.source) {
                    sourceBox.classList.remove('hidden');
                    sourceBox.style.display = 'block';
                    // Enhance formatting for multi-part sources if present
                    let sourceText = q.source.replace(/｜/g, "<br>")
                        .replace(/\+/g, ' <br><i class="fas fa-plus-circle" style="font-size:0.8em; color:var(--primary); margin:0 5px;"></i> ');
                    document.getElementById('q-source-content').innerHTML = sourceText;
                } else {
                    sourceBox.classList.add('hidden');
                    sourceBox.style.display = 'none';
                    // If no source, hide the whole panel if explanation is hidden
                    panel.style.display = 'none';
                }
            }

            nextQuestion() {
                // Reset Feedback Panel Visibility for next question
                document.getElementById('q-explanation').style.display = 'block';

                this.state.currentIndex++;
                this.updateQuizUI();
            }

            prevQuestion() {
                if (this.state.currentIndex > 0) {
                    this.state.currentIndex--;
                    this.updateQuizUI();
                }
            }

            finishQuiz() {
                // Calc Score percentage
                const total = this.state.questions.length;
                const correct = Object.values(this.state.answers).filter(a => a.correct).length;
                const score = total === 0 ? 0 : Math.round((correct / total) * 100);

                document.getElementById('final-score').textContent = score;
                document.getElementById('res-correct').textContent = correct;
                document.getElementById('res-wrong').textContent = total - correct;

                let comment = "继续加油！";
                if (score >= 90) comment = "太神了！学霸附体！";
                else if (score >= 80) comment = "很棒！基础扎实！";
                else if (score >= 60) comment = "及格了，再接再厉！";

                document.getElementById('final-comment').textContent = comment;

                this.switchView('view-result');

                if (score > 80) this.fireConfetti();
            }

            reviewWrong() {
                const wrongIds = Object.keys(this.state.answers).filter(id => !this.state.answers[id].correct);
                if (wrongIds.length === 0) {
                    alert("没有错题！你太强了！");
                    return;
                }

                const wrongQs = this.state.questions.filter(q => wrongIds.includes(q.id));
                this.state.questions = wrongQs;
                this.state.currentIndex = 0;
                this.state.score = 0;
                this.state.answers = {};
                this.state.currentUnitId = "错题攻克";

                this.updateQuizUI();
                this.switchView('view-quiz');
            }

            goHome() {
                this.switchView('view-home');
            }

            switchView(id) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                window.scrollTo(0, 0);
            }

            shuffle(array) {
                return array.sort(() => Math.random() - 0.5);
            }

            fireConfetti() {
                // Simple Confetti Implementation
                const canvas = document.getElementById('confetti-canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const particles = [];
                const colors = ['#6366f1', '#ec4899', '#10b981', '#f59e0b'];

                for (let i = 0; i < 100; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height - canvas.height,
                        vx: Math.random() * 4 - 2,
                        vy: Math.random() * 4 + 2,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: Math.random() * 8 + 4
                    });
                }

                let animationId;
                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    let active = false;
                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.y < canvas.height) active = true;

                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    if (active) requestAnimationFrame(animate);
                };
                animate();
            }
        }

        const app = new App(DATA);
    </script>
</body>

</html>
